<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>太和殿</title>
<style>html,body{margin:0;background:#9fb6cc;overflow:hidden}</style></head>
<body>
<script src="vendor/three.min.js"></script>
<script src="vendor/Sky.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/BufferGeometryUtils.js"></script>
<script src="vendor/MarchingCubes.js"></script>
<script src="vendor/Pass.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/SimplexNoise.js"></script>
<script src="vendor/SSAOShader.js"></script>
<script src="vendor/SSAOPass.js"></script>
<script src="src/params.js"></script>
<script src="src/util.js"></script>
<script src="src/paint.js"></script>
<script src="src/dougong.js"></script>
<script src="src/beasts.js"></script>
<script src="src/stage.js"></script>
<script src="src/hall.js"></script>
<script src="src/terrace.js"></script>
<script src="src/furnish.js"></script>
<script src="src/director.js"></script>
<script src="src/film.js"></script>
<script>
(async () => {
  await document.fonts.load('900 100px "Noto Serif SC"');
  const q = new URLSearchParams(location.search), W = +(q.get('w') || 1920), H = +(q.get('h') || 1236);
  const S = STAGE.init(W, H);
  S.sun.shadow.mapSize.set(8192, 8192); Object.assign(S.sun.shadow.camera, { left: -105, right: 105, top: 105, bottom: -105, near: 1, far: 400 }); S.sun.shadow.camera.updateProjectionMatrix();
  const t0 = performance.now();
  HALL.build(S.root);
  STAGE.tuneEnv();
  // placeholder ground and terrace block (the real three-tier 须弥座 terrace is phase 5)
  TER.build(S.root);
  FUR.build(S.root);
  STAGE.tuneEnv();
  if (q.get('post') !== '0') STAGE.initPost();
  STAGE.aim(new THREE.Vector3(0, 0, 15));
  // gje06: Canon 7D, 35 mm, cropped frame (f = 6197 px at 3840 wide). Camera fitted on 8 landmarks (额枋 edges, both eaves,
  // the three 月台 fronts, the plaza): 191 m from the hall centre, 1.3 m below the hall floor, pitched down 1.54°
  STAGE.views = {
    front: { pos: [1.0, -1.3, 191.2], target: [1.0, -1.3 - Math.tan(1.54 * Math.PI / 180) * 191.2, 0], fov: 2 * Math.atan(1236 / 6197) * 180 / Math.PI },
    oblique: { pos: [-62, 6, 78], target: [0, 11, 0], fov: 35 },
    upperCorner: { pos: [-20, 13, 30], target: [-27, 15.5, 14], fov: 35 },
    wen: { pos: [6, 24.5, 34], target: [13.6, 27.6, 0], fov: 16 },
    upperBand: { pos: [6, 8, 34], target: [0, 12.3, 13], fov: 40 },
    queti: { pos: [-1.5, 4.2, 22.5], target: [-4.2, 6.3, 16.6], fov: 40 },
    terrace: { pos: [-95, 14, 135], target: [0, -3, 20], fov: 30 },
    stairs: { pos: [-28, -4, 105], target: [0, -3, 62], fov: 35 },
    balus: { pos: [-62, -6.4, 66], target: [-48, -4.8, 44], fov: 40 },
    yuetai: { pos: [-14, 2.5, 66], target: [4, -1, 44], fov: 45 },
    porch: { pos: [-6, 2.0, 24], target: [-3, 5.5, 14], fov: 50 },
  };
  window.INFO = Object.assign(HALL.info, { ter: TER.info }); console.log('build ms', performance.now() - t0, JSON.stringify(HALL.info.heights), HALL.info.brackets, HALL.info.fScale);
  // film mode: render(t) → 2D canvas with captions
  const out = document.createElement('canvas'); out.width = W; out.height = H; const og = out.getContext('2d');
  S.root.traverse(o => { if (o.isInstancedMesh) o.frustumCulled = false; });   // r147 culls instances by the base geometry only
  let built = false;
  const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const ag = acc.getContext('2d');
  const sceneAt = (t) => {
    if (!built) { DIR.prepare(FILM.PHASES); built = true; }
    DIR.apply(t);
    const s = FILM.sun(t); STAGE.setSun(s.az, s.el, s.col, s.int); S.r.toneMappingExposure = s.exp; STAGE.hemi.intensity = .42 - .12 * (t / FILM.DUR);
    const c = FILM.camera(t); STAGE.look(c.pos, c.tgt, c.fov); STAGE.renderPost();
  };
  // motion blur: n sub-frames across a 180° shutter, never across a cut
  window.filmFrame = (t, n = 4) => {
    for (let k = 0; k < n; k++) {
      let ts = n > 1 ? t + (k / (n - 1) - .5) * .5 / FILM.FPS : t;
      for (const c of FILM.CUTS) { if (ts < c && c <= t) ts = c; else if (t < c && c <= ts) ts = c - 1e-4; }
      sceneAt(Math.max(0, ts)); ag.globalAlpha = 1 / (k + 1); ag.drawImage(STAGE.r.domElement, 0, 0);
    }
    og.globalAlpha = 1; og.drawImage(acc, 0, 0); FILM.caption(og, t, W, H); return out.toDataURL('image/jpeg', .95);
  };
  window.READY = true;
  if (!window.__CAPTURE__) { const v = STAGE.views.oblique; STAGE.look(v.pos, v.target, v.fov); STAGE.interactive(v.target); }
})();
</script>
</body></html>
